        :root {

        /* Mobile Container Simulation */
        .app-container {

            height: 100%;
            background-color: #fff;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        /* --- HEADER --- */
        header { background: #fff; padding: 10px 15px 0; z-index: 10; width:100%;}
        .header-top { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .header-top i { font-size: 20px; color: var(--text-main); }
        .search-bar { flex: 1; display: flex; align-items: center; background: var(--bg-color); border-radius: 20px; padding: 8px 15px; border: 1px solid var(--border-color); }
        .search-bar input { flex: 1; border: none; background: transparent; outline: none; padding: 0 10px; font-size: 14px; direction: rtl; }
      
        .top-nav { display: flex; overflow-x: auto; gap: 20px; padding-bottom: 10px; scrollbar-width: none; }
        .top-nav::-webkit-scrollbar { display: none; }
        .top-nav span ,a { text-decoration: none; font-size: 15px; color: var(--text-muted);margin-right:5px; white-space: nowrap; cursor: pointer; padding-bottom: 5px; font-weight: 600; }
        .top-nav span.active { color: var(--text-main); border-bottom: 2px solid var(--text-main); }
         
        /* --- MAIN SCROLLABLE CONTENT --- */
        .main-content { flex: 1; overflow-y: auto; background-color: var(--bg-color); padding-bottom: 70px; }

        /* Categories Grid */
        .categories { display: grid; grid-template-columns: repeat(4, 1fr); gap: 25px 10%; padding: 15px 10px; background: #fff; margin-bottom: 10px; }
        .category-item { display: flex; flex-direction: column; align-items: center; gap: 5px; text-align: center; }
        .category-item img { width: 55px; height: 55px; border-radius: 50%; object-fit: cover; background: #eee; }
        .category-item span { font-size: 11px; color: #333; line-height: 1.2; }

        /* Filters */
        .filters { display: flex;
            width:100%;
            padding: 0;
            margin:0;

        .filter-btn {
             padding: 6px 15px;
             border-radius: 20px;

                white-space: nowrap;
                 cursor: pointer;

                 flex:1;
                text-align: center;
                }
        .filter-btn.active { background: #f1718c; color: #fff; border-color: #f1718c; }

        /* Product Grid */
        .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 10px 10px; margin-top: 5%; }
        
        .product-card { background: #ffffff; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; transition: transform 0.2s; }
        .product-card:active { transform: scale(0.98); }

        .product-img-wrapper { position: relative; padding-top: 130%; }
        .product-img-wrapper img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .product-info { padding: 10px; display: flex; flex-direction: column; gap: 5px; }
        .product-title { font-size: 13px; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .discount-tag { background: #ffebeb; color: var(--accent-red); font-size: 11px; padding: 2px 4px; border-radius: 2px; font-weight: bold; display: inline-block; width: fit-content; }
        .price-row { display: flex; flex-direction: column; gap: 2px; }
        .price { font-size: 15px; font-weight: bold; color: var(--accent-red); }
        .sold-count { font-size: 11px; color: var(--text-muted); direction: rtl; }
        .rating { font-size: 10px; color: #f5a623; display: flex; gap: 2px; }
        .rating span { color: var(--text-muted); font-size: 11px; margin-left: 2px;}

        /* --- BOTTOM NAV --- */
        .bottom-nav { position: absolute; bottom: 0; width: 100%; background: #fff; display: flex; justify-content: space-around; padding: 10px 0 15px; border-top: 1px solid var(--border-color); z-index: 10; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); cursor: pointer; font-size: 10px; }
        .nav-item i { font-size: 20px; }
        .nav-item.active { color: var(--text-main); font-weight: bold; }

        /* --- السلايدر --- */
        .mySlides { margin-top: 5%; display: none; }
        .fade { animation-name: fade; animation-duration: 1.5s; }
        @keyframes fade { from {opacity: .4} to {opacity: 1} }

        /* --- MODAL STYLES --- */
        .modal {
            display: none; 
            position: absolute; 
            z-index: 100; 
            left: 0; top: 0;
            width: 100%; height: 100%; 
            background-color: rgba(0,0,0,0.5);
            backdrop-filter: blur(2px);
        }

        .modal-content {
            background-color: white; 
            position: absolute; 
            bottom: 0; 
            width: 100%;
            border-radius: 20px 20px 0 0; 
            padding: 20px; 
            box-shadow: 0 -5px 15px rgba(0,0,0,0.1);
            animation: slideUp 0.3s ease-out;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

            width: 30px; height: 30px; display: flex;

    const productGrid = document.getElementById('productGrid');
    // غير القيم دي براحتك حسب سعر اليوم والعمولة الحاببها
const EXCHANGE_RATE = 1200;     // سعر الصرف اليوم (مثلاً الدولار أو الريال مقابل العملة المحلية)
const FIXED_COMMISSION = 10;   // العمولة الثابتة التي تريد زيادتها لكل منتج
  productsData.forEach(product => {
    // 1. تنظيف وفصل السعر عن عدد المبيعات كالمعتاد
    const priceInfo = product.price.split('\n\n');
    const soldCount = priceInfo[1] ? priceInfo[1] : '';

    // 2. استخراج الرقم الصافي من السعر (يمسح الرمز الغريب ويحول النص إلى رقم حقيقي)
    const originalPrice = parseFloat(priceInfo[0].replace('', '').trim());

    // 3. العملية الحسابية: (السعر الأصلي × سعر الصرف) + العمولة الثابتة
    const localPriceNumber = (originalPrice + FIXED_COMMISSION) *  EXCHANGE_RATE;

    // 4. تنسيق السعر النهائي ليظهر بشكل أنيق (مثال: ج.س 13,800) بدون كسور
    const cleanPrice = "ج.س " + Math.round(localPriceNumber).toLocaleString('en-US');
    
    // الآن المتغير cleanPrice أصبح يحمل السعر المحلي الجديد وجاهز للعرض في الكارت...
      let imgUrl = product.image_url.trim().startsWith('//') ? 'https:' + product.image_url.trim() : product.image_url;
      
      
      
      const cardHTML = `
            <div class="product-card"
                 data-title="${product.title}"
                 data-price="${cleanPrice}"
                 data-sold="${soldCount}"
                 data-img="${product.image_url}"
                  data-link="${product.product_link}">


                 
                 
                <div class="product-img-wrapper">
                    <img src="${imgUrl}" alt="${product.title}">
                </div>
                <div class="product-info">
                    <span class="product-title">${product.title}</span>
                    <div class="rating"></div>
                    <div class="price-row">
                        <span class="price">${cleanPrice}</span>
                        ${soldCount ? `<span class="sold-count">${soldCount}</span>` : ''}
                    </div>
                </div>
            </div>
        `;
        productGrid.insertAdjacentHTML('beforeend', cardHTML);
    });

    // --- أكواد القوائم والفلتر الأصلية ---
    const topNavSpans = document.querySelectorAll('#topNav span');
    topNavSpans.forEach(span => {
        span.addEventListener('click', () => {
            document.querySelector('#topNav span.active').classList.remove('active');
            span.classList.add('active');
        });
    });

    const filterBtns = document.querySelectorAll('.filter-btn');
    filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelector('.filter-btn.active').classList.remove('active');
            btn.classList.add('active');
        });
    });

    const bottomNavItems = document.querySelectorAll('#bottomNav .nav-item');
    bottomNavItems.forEach(item => {
        item.addEventListener('click', () => {
            document.querySelector('#bottomNav .nav-item.active').classList.remove('active');
            item.classList.add('active');
        });
    });

    // --- كود السلايدر الأصلي ---
    let slideIndex = 0;
    showSlides();
    function showSlides() {
        let i;
        let slides = document.getElementsByClassName("mySlides");
        for (i = 0; i < slides.length; i++) {
            slides[i].style.display = "none";
        }
        slideIndex++;
        if (slideIndex > slides.length) {slideIndex = 1}
        slides[slideIndex-1].style.display = "block";
        setTimeout(showSlides, 3000);
    }

    // --- كود النافذة المنبثقة (MODAL JAVASCRIPT) بعد حقن العناصر المضافة حديثاً ---
    const modal = document.getElementById("productModal");
    const closeBtn = document.querySelector(".close-modal");
    const productCards = document.querySelectorAll(".product-card");

    productCards.forEach(card => {
        card.addEventListener('click', function() {
            const title = this.getAttribute("data-title");
            const price = this.getAttribute("data-price");
            const rawImg = this.getAttribute("data-img"); 
            
        // 2. جلب وتصحيح رابط شي إن للمنتج (الجديد)
        const rawLink = this.getAttribute("data-link");
        const sheinLink = rawLink && rawLink.trim().startsWith('//') ? 'https:' + rawLink.trim() : rawLink;

        // 2. فحص وتعديل الرابط طائراً (السطر السحري)
        const img = rawImg.trim().startsWith('//') ? 'https:' + rawImg.trim() : rawImg;
            const sold = this.getAttribute("data-sold");
            
            document.getElementById("modalTitle").innerText = title;
            document.getElementById("modalPrice").innerText = price;
            document.getElementById("modalImg").src = img;
            document.getElementById("modalSold").innerText = sold;
                const whatsappMessage = `الاسم: ${title}\n
                السعر: ${price}\n
                رابط الصورة: ${img}\n
                رابط المنتج ${rawLink}`;

            document.getElementById("btn").href = "https://Wa.me/249128039027?text=" + encodeURIComponent(whatsappMessage);
            document.getElementById("sheinBtn").href = sheinLink;
            modal.style.display = "block";
        });
    });

    closeBtn.onclick = function() {
        modal.style.display = "none";
    }

    window.onclick = function(event) {
        if (event.target == modal) {
            modal.style.display = "none";
        }
    }
</script>
